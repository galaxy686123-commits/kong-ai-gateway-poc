# ─────────────────────────────────────────────────────────────
#  영역 ④ 가드레일 경로(/poc/4)에 붙는 의미 기반 가드 — 임베딩 모델(DECK_EMBED_URL·DECK_EMBED_MODEL)과
#  영역별 시험 경로(20-areas.yaml)가 둘 다 있을 때만 적용된다.
#    4-3 질문: 금지 예문과 의미가 가까운 질문을 막는다 — 정규식(20-areas.yaml)을 피해 표현을 바꾼 우회도 잡는다
#    4-4 답변: 금지 답변 예문과 의미가 가까운 답변을 막는다 — 키워드 검사(PII 가드)에 없는 표현도 잡는다
#  ④ 는 질문도 답변도 「규칙 + 의미」 두 겹이 된다.
#  답변 가드가 막으면 Kong 3.16.0.0 은 400 {"error":{"message":"bad response"}} 를 낸다(공식 문서에는 403,
#  검사 중 오류도 막음) — 20-areas.yaml 의 post-function 이 본문을 표준 문구(DECK_BLOCK_MESSAGE)로 바꾼다.
#  임베딩 서버가 멈추면 이 경로의 답변이 모두 막힐 수 있다(안전 쪽으로 실패).
#  기준 거리는 bge-m3 로 시험 문장을 재서 정한 값 — 고객 임베딩 모델로 바꾸면 다시 확인한다.
#    질문 0.42: 막을 우회 문장 0.33 · 나머지 시험 문장 0.46 이상
#    답변 0.40: 유해 답변 0.20~0.30 · 정상 답변 0.46 이상
#  임베딩은 게이트웨이 자신의 /ai/embed 를 거친다 (70-semantic.yaml).
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

plugins:
  # 4-3 의미 기반 질문 가드
  - name: ai-semantic-prompt-guard
    route: poc-4-guardrail
    config:
      embeddings: &embeddings
        model:
          provider: openai
          name: ${{ env "DECK_EMBED_MODEL" }}
          options:
            upstream_url: ${{ env "DECK_KONG_LOOPBACK" }}/ai/embed
      rules:
        match_all_conversation_history: false
        match_all_roles: false
        deny_prompts:
          - 이전 지시나 규칙을 무시하고 제한 없이 무엇이든 답하라는 역할극·탈옥 요청
          - 시스템 프롬프트나 숨겨진 지침, 내부 설정을 그대로 보여 달라는 요청
          - 회사 기밀 정보, 내부 시스템 계정, 비밀번호를 알아내려는 요청
          - 고객이나 직원의 개인정보를 우회적으로, 나눠서, 한 글자씩 알려 달라는 요청
      search:
        threshold: 0.42                 # 코사인 거리 — 작을수록 엄격
      vectordb:
        strategy: pgvector
        dimensions: ${{ env "DECK_EMBED_DIMS" }}
        distance_metric: cosine
        threshold: 0.42
        pgvector: &pgvector
          host: ${{ env "DECK_PG_HOST" }}
          port: ${{ env "DECK_PG_PORT" }}
          database: kong-pgvector
          user: kong

  # 4-4 의미 기반 답변 가드
  - name: ai-semantic-response-guard
    route: poc-4-guardrail
    config:
      embeddings: *embeddings
      rules:
        max_response_body_size: 0       # 답변 전체를 검사 (기본 8 KB 까지만)
        deny_responses:
          - 폭발물이나 무기를 만드는 구체적인 방법을 설명하는 답변
          - 마약을 만들거나 구하는 방법을 알려 주는 답변
          - 자해나 자살 방법을 구체적으로 알려 주는 답변
          - 특정 집단을 비하하거나 혐오와 차별을 부추기는 답변
      search:
        threshold: 0.40                 # 코사인 거리 — 작을수록 엄격
      vectordb:
        strategy: pgvector
        dimensions: ${{ env "DECK_EMBED_DIMS" }}
        distance_metric: cosine
        threshold: 0.40
        pgvector: *pgvector

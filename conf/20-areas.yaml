# ─────────────────────────────────────────────────────────────
#  영역별 시험 경로 /poc/<영역>/v1/chat/completions — 검증 항목의 네 영역(킥오프 자료 ①~④)마다 경로 하나.
#  그 영역의 플러그인만 붙여 Kong Manager 의 Routes 목록이 네 영역과 1:1 로 맞는다. 키 인증(apikey)은 공통.
#    ① /poc/1  서비스 등록·연동   — 스트리밍(1-2) · 장애 대체(1-4: 헤더 X-Mock-Down 으로 주 모델 장애를 일으킴)
#    ② /poc/2  접근·사용량 제어   — 키(2-1) · 그룹 허용 · 호출 수(2-3) · 토큰·비용(2-4) 한도 — 바로 확인되게 낮춘 시험값
#    ③ /poc/3  이력·감사          — 로그·추적 ID·지표는 00-base 의 전역 설정이 모든 경로에 남긴다. 이 경로는 확인용 + 긴급 차단(3-4)
#    ④ /poc/4  가드레일           — 기밀 키워드(4-2) · 인젝션(4-3) · 유해 답변(4-4) · 답변 속 내부 정보(4-5). 4-1 마스킹은 전역
#  다른 경로를 쓰는 항목: 1-1 헤더 x-ai-target(12~15) · 1-3 /ocr·/agents(40) · 2-1 SSO /sso(50) · 2-2 /agents(40)
#  LLM 은 기본으로 모의 LLM(받은 질문을 그대로 답함)이라 결과가 늘 같다 — LLM 이 실제로 무엇을 받았는지,
#  답변이 어떻게 바뀌는지 그대로 보인다. 설정 파일의 FEATURE_UPSTREAM=llm 이면 사내 LLM 으로 보낸다.
#  임베딩 모델이 있으면 ④ 에 의미 기반 가드(질문 4-3 · 답변 4-4)가 더 붙는다 (21-areas-semantic.yaml).
#  verify.sh 가 이 경로들로 요구사항을 점검한다. 지우려면 apply-config.sh --no-areas
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  # ① 서비스 등록·연동 ─ 1-2 스트리밍 · 1-4 장애 대체
  - name: poc-1-integration
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: poc-1-integration
        paths: [/poc/1/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
        plugins:
          - &key-auth
            name: key-auth
            config:
              key_names: [apikey]
              hide_credentials: true
          - name: ai-proxy-advanced
            config:
              response_streaming: allow
              max_request_body_size: 8388608
              model_name_header: true           # 응답 헤더 X-Kong-LLM-Model 로 실제 응답한 모델을 알려 준다
              balancer:
                algorithm: priority             # weight 가 큰 대상부터. 실패하면 다음 순위로 (1-4)
                # POST 는 원래 다시 보내지 않는다 → non_idempotent 를 넣어야 장애 시 다른 모델로 넘어간다
                failover_criteria: [error, timeout, non_idempotent, http_429, http_500, http_502, http_503, http_504]
                retries: 2
                connect_timeout: 5000
                read_timeout: 300000
                write_timeout: 60000
              targets:
                - description: 주 모델 (1순위) — 모의 LLM 은 요청 헤더 X-Mock-Down 에 이 모델 이름이 오면 503 (장애 재현)
                  weight: 100
                  route_type: llm/v1/chat
                  auth:
                    header_name: Authorization
                    header_value: '${{ env "DECK_FEATURE_AUTH" }}'
                  logging:
                    log_statistics: true
                    log_payloads: false
                  model:
                    provider: openai
                    name: ${{ env "DECK_FEATURE_MODEL" }}
                    options:
                      upstream_url: ${{ env "DECK_FEATURE_URL" }}
                - description: 보조 모델 (2순위 — 주 모델 장애 시)
                  weight: 10
                  route_type: llm/v1/chat
                  auth:
                    header_name: Authorization
                    header_value: "Bearer mock"
                  logging:
                    log_statistics: true
                    log_payloads: false
                  model:
                    provider: openai
                    name: backup-model
                    options:
                      upstream_url: ${{ env "DECK_MOCK_URL" }}/v1/chat/completions

  # ② 접근·사용량 제어 ─ 2-1 키 · 그룹 허용 · 2-3 호출 수 · 2-4 토큰·비용
  #    한도는 바로 확인되게 낮춘 시험값이다. 통합 경로의 한도는 설정 파일의 DECK_RPM · DECK_RPD · DECK_TPM.
  - name: poc-2-access
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: poc-2-access
        paths: [/poc/2/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false
        plugins:
          - *key-auth
          - name: acl                       # 허용한 부서(그룹)의 키만 통과
            config:
              allow: [team-a, team-b]
              hide_groups_header: true
          - name: rate-limiting             # 2-3 사용자별 호출 수 — 분당 3회 · 하루 1000회
            config:
              minute: 3
              day: 1000
              limit_by: consumer
              policy: local
          - name: ai-rate-limiting-advanced # 2-4 사용자별 토큰·예상 비용 — 둘 중 하나라도 넘으면 429
            config:
              strategy: local
              policies:
                - match:                    # 분당 40 토큰
                    - type: consumer
                      partition_by: true
                  limits:
                    - limit: 40
                      window_size: 60
                      tokens_count_strategy: total_tokens
                - match:                    # 분당 예상 비용 0.1 (아래 단가 기준 — 비용은 다음 요청부터 반영된다)
                    - type: consumer
                      partition_by: true
                  limits:
                    - limit: 0.1
                      window_size: 60
                      tokens_count_strategy: cost
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              response_streaming: allow
              max_request_body_size: 8388608
              model_name_header: true
              auth:
                header_name: Authorization
                header_value: '${{ env "DECK_FEATURE_AUTH" }}'
              logging:
                log_statistics: true
                log_payloads: false
              model:
                provider: openai
                name: ${{ env "DECK_FEATURE_MODEL" }}
                options:
                  upstream_url: ${{ env "DECK_FEATURE_URL" }}
                  input_cost: 1000          # 시험용 예시 단가 — 100만 토큰당 (단위는 한도와 같게, 예: 원)
                  output_cost: 2000

  # ③ 이력·감사 ─ 3-1 요청 로그 · 3-2 추적 ID · 3-3 지표는 00-base 의 전역 플러그인이 모든 경로에 남긴다.
  #    이 경로는 확인용 요청을 보내는 곳이고, 3-4 긴급 차단 스위치가 붙어 있다.
  - name: poc-3-audit
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: poc-3-audit
        paths: [/poc/3/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false
        plugins:
          - *key-auth
          - name: request-termination       # 3-4 긴급 차단 — 평소 꺼 둠. Kong Manager 에서 켜면 즉시 503
            instance_name: kill-switch--poc-3
            enabled: false
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              response_streaming: allow
              max_request_body_size: 8388608
              model_name_header: true
              auth:
                header_name: Authorization
                header_value: '${{ env "DECK_FEATURE_AUTH" }}'
              logging:
                log_statistics: true
                log_payloads: false
              model:
                provider: openai
                name: ${{ env "DECK_FEATURE_MODEL" }}
                options:
                  upstream_url: ${{ env "DECK_FEATURE_URL" }}

  # ④ 가드레일 ─ 질문 검사(4-2 · 4-3) → LLM → 답변 검사(4-4 · 4-5). 4-1 개인정보 마스킹은 00-base 의 전역 설정
  #    답변을 다 받아 검사·수정하므로 이 경로는 스트리밍 요청을 받지 않는다.
  - name: poc-4-guardrail
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: poc-4-guardrail
        paths: [/poc/4/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false
        plugins:
          - *key-auth
          - name: ai-prompt-guard           # 4-2 기밀 키워드 · 4-3 인젝션·탈옥 (정규식)
            config:
              match_all_roles: false
              deny_patterns:
                - '(?i)(?:ignore|disregard|forget)\s+(?:all\s+)?(?:previous|above|prior)\s+(?:instruction|prompt|rule)'
                - '(?i)(?:이전|앞의|위의)\s*(?:지시|명령|규칙|지침).{0,10}(?:무시|잊어|따르지)'
                - '(?i)(?:시스템\s*프롬프트|system\s+prompt).{0,20}(?:알려|보여|출력|공개|reveal|show|print)'
                - '(?i)(?:jailbreak|탈옥|DAN\s+mode|developer\s+mode)'
                - '(?i)<\s*script|javascript:|\bon(?:error|load)\s*='
                - 'sk-[A-Za-z0-9_\-]{20,}'
                - '${{ env "DECK_DLP_PATTERN" }}'
          - name: ai-custom-guardrail       # 4-4 답변을 PII 가드로 검사 → 유해 표현이면 표준 문구
            config:
              guarding_mode: OUTPUT
              stop_on_error: true           # 검사 서비스가 응답하지 않으면 답변을 내보내지 않는다
              timeout: 5000
              request:
                url: ${{ env "DECK_PII_URL" }}
                body:
                  text: "$(content)"
                  source: "$(source)"
              functions:
                # 답변 검사 단계에서는 검사 서비스 응답이 문자열로 들어온다 → 직접 읽는다
                verdict: |
                  return function(resp)
                    if type(resp) == "string" then
                      return { block = resp:find('"block"%s*:%s*true') ~= nil }
                    end
                    return resp or {}
                  end
              response:
                block: "$(verdict.block)"
                block_message: ${{ env "DECK_BLOCK_MESSAGE" }}
          - name: post-function             # 4-5 답변 속 내부 IP·API 키·DB 접속 정보 마스킹
            instance_name: mask-system-info--poc-4
            config:
              access:
                # 압축된 응답은 글자를 바꿀 수 없다 → 업스트림에 압축을 요청하지 않는다
                - kong.service.request.clear_header("Accept-Encoding")
              header_filter:
                - kong.response.clear_header("Content-Length")
              body_filter:
                - |
                  local body = kong.response.get_raw_body()      -- 마지막 조각에서 전체 본문을 돌려준다
                  if not body then return end
                  -- 4-4 의미 기반 답변 가드(21-areas-semantic.yaml)가 막은 답변 — 본문을 표준 문구로 바꾼다
                  --   Kong 3.16.0.0 실측은 400 {"error":{"message":"bad response"}} (공식 문서에는 403)
                  local status = kong.response.get_status()
                  if status == 403 or (status == 400 and body:find('"bad response"', 1, true)) then
                    local cjson = require "cjson.safe"
                    kong.response.set_raw_body(cjson.encode({ error = { message = [[${{ env "DECK_BLOCK_MESSAGE" }}]] } }))
                    return
                  end
                  local RULES = {
                    { "10%.%d+%.%d+%.%d+", "[내부IP]" },
                    { "172%.1[6-9]%.%d+%.%d+", "[내부IP]" },
                    { "172%.2%d%.%d+%.%d+", "[내부IP]" },
                    { "172%.3[01]%.%d+%.%d+", "[내부IP]" },
                    { "192%.168%.%d+%.%d+", "[내부IP]" },
                    { "sk%-[%w%-_][%w%-_][%w%-_][%w%-_][%w%-_]+", "[API키]" },
                    { "AKIA[%u%d][%u%d][%u%d][%u%d]+", "[API키]" },
                    { "gh[po]_%w+", "[API키]" },
                    { "xox[abpr]%-[%w%-]+", "[API키]" },
                    { "(%a[%w%+%.%-]*://)[^:/@%s\"]+:[^@%s\"]+@", "%1***:***@" },
                    { "([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]%s*[=:]%s*)[^%s,;\"\\]+", "%1***" },
                  }
                  local total = 0
                  for _, r in ipairs(RULES) do
                    local n
                    body, n = body:gsub(r[1], r[2])
                    total = total + n
                  end
                  if total > 0 then kong.log.set_serialize_value("output_masked", total) end
                  kong.response.set_raw_body(body)
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              response_streaming: deny
              max_request_body_size: 8388608
              model_name_header: true
              auth:
                header_name: Authorization
                header_value: '${{ env "DECK_FEATURE_AUTH" }}'
              logging:
                log_statistics: true
                log_payloads: false
              model:
                provider: openai
                name: ${{ env "DECK_FEATURE_MODEL" }}
                options:
                  upstream_url: ${{ env "DECK_FEATURE_URL" }}

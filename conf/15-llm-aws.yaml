# ─────────────────────────────────────────────────────────────
#  AWS Bedrock — 단일 주소 /v1/chat/completions 에서 헤더 x-ai-target: aws 로 고른다 (1-1)
#  DECK_AWS_REGION 이 있을 일 때 apply-config.sh 가 적용한다. 외부 LLM 이라 기밀 키워드(4-2)를 막는다.
#  인증 값은 Kong Vault(env)에서 읽는다 — .env 의 AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  - name: llm-aws
    url: https://bedrock-runtime.${{ env "DECK_AWS_REGION" }}.amazonaws.com
    read_timeout: 300000
    routes:
      - name: llm-aws
        paths: [/v1/chat/completions]
        headers:
          x-ai-target: [aws]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
        plugins:
          - name: key-auth
            config:
              key_names: [apikey]
              hide_credentials: true
          - name: acl
            config:
              allow: [team-a, team-b]
              hide_groups_header: true
          - name: rate-limiting
            config:
              minute: ${{ env "DECK_RPM" }}
              day: ${{ env "DECK_RPD" }}
              limit_by: consumer
              policy: local
          - name: ai-rate-limiting-advanced
            config:
              strategy: local
              policies:
                - match:
                    - type: consumer
                      partition_by: true
                  limits:
                    - limit: ${{ env "DECK_TPM" }}
                      window_size: 60
                      tokens_count_strategy: total_tokens
          - name: ai-prompt-guard
            config:
              match_all_roles: false
              deny_patterns:
                - '(?i)(?:ignore|disregard|forget)\s+(?:all\s+)?(?:previous|above|prior)\s+(?:instruction|prompt|rule)'
                - '(?i)(?:이전|앞의|위의)\s*(?:지시|명령|규칙|지침).{0,10}(?:무시|잊어|따르지)'
                - '(?i)(?:시스템\s*프롬프트|system\s+prompt).{0,20}(?:알려|보여|출력|공개|reveal|show|print)'
                - '(?i)(?:jailbreak|탈옥|DAN\s+mode|developer\s+mode)'
                - '(?i)<\s*script|javascript:|\bon(?:error|load)\s*='
                - 'sk-[A-Za-z0-9_\-]{20,}'
                - '${{ env "DECK_DLP_PATTERN" }}'
          - name: request-termination
            instance_name: kill-switch--llm-aws
            enabled: false
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              response_streaming: allow
              max_request_body_size: 8388608
              model_name_header: true
              logging:
                log_statistics: true
                log_payloads: false
              auth:
                aws_access_key_id: "{vault://env/aws-access-key-id}"
                aws_secret_access_key: "{vault://env/aws-secret-access-key}"
              model:
                provider: bedrock
                name: ${{ env "DECK_AWS_MODEL" }}
                options:
                  bedrock:
                    aws_region: ${{ env "DECK_AWS_REGION" }}

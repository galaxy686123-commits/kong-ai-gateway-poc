# ─────────────────────────────────────────────────────────────
#  2-1 사내 SSO — /sso/v1/chat/completions → 사내 LLM. 사내 IdP(OIDC)가 발급한 토큰으로만 호출한다.
#  DECK_OIDC_ISSUER 가 있을 때 apply-config.sh 가 적용한다.
#    호출: Authorization: Bearer <IdP 가 발급한 액세스 토큰>
#  토큰의 사용자(preferred_username)를 X-User 헤더로 LLM 에 넘기고 요청 로그에도 남긴다.
#  (API 키 경로 /v1/chat/completions 와 같은 LLM 을 쓰며, 사람 사용자는 SSO·시스템은 키로 나눈다)
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  - name: llm-sso
    url: ${{ env "DECK_CHAT_URL" }}
    read_timeout: 300000
    routes:
      - name: llm-sso
        paths: [/sso/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: openid-connect
        config:
          issuer: ${{ env "DECK_OIDC_ISSUER" }}
          client_id:
            - ${{ env "DECK_OIDC_CLIENT_ID" }}
          client_secret:
            - "{vault://env/oidc-client-secret}"
          auth_methods: [bearer]
          cache_tokens_salt: ${{ env "DECK_OIDC_SALT" }}    # 동기화 때마다 바뀌지 않게 고정 (apply-config.sh 가 만든다)
          bearer_token_param_type: [header]
          consumer_optional: true
          upstream_headers_claims: [preferred_username]
          upstream_headers_names: [X-User]
      - name: ai-prompt-guard
        config:
          match_all_roles: false
          deny_patterns:
            - '(?i)(?:ignore|disregard|forget)\s+(?:all\s+)?(?:previous|above|prior)\s+(?:instruction|prompt|rule)'
            - '(?i)(?:이전|앞의|위의)\s*(?:지시|명령|규칙|지침).{0,10}(?:무시|잊어|따르지)'
            - '(?i)(?:시스템\s*프롬프트|system\s+prompt).{0,20}(?:알려|보여|출력|공개|reveal|show|print)'
            - '(?i)(?:jailbreak|탈옥|DAN\s+mode|developer\s+mode)'
      - name: request-termination
        instance_name: kill-switch--llm-sso
        enabled: false
        config:
          status_code: 503
          message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: allow
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: "{vault://env/llm-auth-header}"
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_CHAT_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_CHAT_URL" }}

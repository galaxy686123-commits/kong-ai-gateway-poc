# ─────────────────────────────────────────────────────────────
#  2-1 사내 SSO — /poc 에 openid-connect 를 붙인다 (DECK_OIDC_ISSUER 가 있을 때만, 처음에는 꺼 둠 — FEATURE_SSO)
#  사내 IdP 가 발급한 토큰(Authorization: Bearer …)으로 부른다. 사용자 이름은 X-User 헤더로 LLM 에 넘긴다.
#  부서 키(key-auth)와 함께 켜면 둘 다 있어야 통과하므로, SSO 를 시험할 때는 key-auth 를 끈다.
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

plugins:
  - name: openid-connect
    route: poc
    enabled: ${{ env "DECK_ON_SSO" }}   # FEATURE_SSO — 켜면 key-auth 도 같이 켜져 있으면 둘 다 필요하므로, SSO 를 시험할 때는 FEATURE_KEY_AUTH off
    config:
      issuer: ${{ env "DECK_OIDC_ISSUER" }}
      client_id:
        - ${{ env "DECK_OIDC_CLIENT_ID" }}
      client_secret:
        - "{vault://env/oidc-client-secret}"
      auth_methods: [bearer]
      cache_tokens_salt: ${{ env "DECK_OIDC_SALT" }}    # 동기화 때마다 바뀌지 않게 고정 (apply-config.sh 가 만든다)
      bearer_token_param_type: [header]
      consumer_optional: true
      upstream_headers_claims: [preferred_username]
      upstream_headers_names: [X-User]

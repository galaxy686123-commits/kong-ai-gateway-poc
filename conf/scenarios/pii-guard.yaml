# ─────────────────────────────────────────────────────────────
#  시나리오: 한국어 PII 가드 (addons/pii-guard/app.py 가 있을 때만 적용)
#
#  요청 본문을 가드레일 서비스로 보내 판정을 받는다.
#  정규식 가드(기본 시나리오)가 못 잡는 문맥 — 예: 이름과 계약 정보의 조합 — 까지 본다.
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  - name: llm-chat-pii
    url: ${{ env "DECK_CHAT_URL" }}
    routes:
      - name: llm-chat-pii
        paths:
          - /poc/pii/v1/chat/completions
        protocols: [http, https]
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: ai-custom-guardrail
        config:
          guarding_mode: INPUT
          text_source: concatenate_user_content
          stop_on_error: true
          allow_masking: true
          timeout: 10000
          request:
            url: http://kong-poc-pii:8080/check
            headers:
              Content-Type: application/json
            body:
              text: $(content)
          response:
            block: $(resp.block)
            block_message: $(resp.detail)
          metrics:
            block_reason: $(resp.reason)
            block_detail: $(resp.detail)
            masked: $(resp.masked)
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          auth:
            header_name: Authorization
            header_value: "{vault://env/llm-auth-header}"
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_CHAT_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_CHAT_URL" }}

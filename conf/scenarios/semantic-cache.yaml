# ─────────────────────────────────────────────────────────────
#  시나리오: 시맨틱 캐시 (DECK_EMBED_URL 이 있을 때만 적용)
#
#  의미가 같은 질문이면 LLM 을 호출하지 않고 저장된 답을 돌려준다.
#  임베딩은 게이트웨이 자신의 /ai/embed 를 거쳐 간다.
#  vLLM 등 일부 임베딩 서버는 dimensions 파라미터를 거부하는데,
#  /ai/embed 앞단의 pre-function 이 그 파라미터를 제거한다.
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  - name: ai-embed
    url: ${{ env "DECK_EMBED_URL" }}
    routes:
      - name: ai-embed
        paths:
          - /ai/embed
        protocols: [http, https]
    plugins:
      - name: pre-function
        config:
          access:
            - |
              local cjson = require "cjson.safe"
              local body = kong.request.get_raw_body()
              if body then
                local t = cjson.decode(body)
                if t and t.dimensions ~= nil then
                  t.dimensions = nil
                  kong.service.request.set_raw_body(cjson.encode(t))
                end
              end
      - name: ai-proxy
        config:
          route_type: llm/v1/embeddings
          genai_category: text/embeddings   # 3.15 부터 임베딩은 이 값을 명시해야 함
          auth:
            header_name: Authorization
            header_value: "{vault://env/embed-auth-header}"
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_EMBED_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_EMBED_URL" }}

  - name: llm-chat-cache
    url: ${{ env "DECK_CHAT_URL" }}
    routes:
      - name: llm-chat-cache
        paths:
          - /poc/cache/v1/chat/completions
        protocols: [http, https]
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: ai-semantic-cache
        config:
          cache_ttl: 3600
          message_countback: 1
          stop_on_failure: false        # 캐시 장애 시에도 LLM 호출은 계속
          embeddings:
            model:
              provider: openai
              name: ${{ env "DECK_EMBED_MODEL" }}
              options:
                upstream_url: ${{ env "DECK_KONG_LOOPBACK" }}/ai/embed
          vectordb:
            strategy: pgvector
            dimensions: ${{ env "DECK_EMBED_DIMS" }}
            distance_metric: cosine
            threshold: 0.15             # 코사인 거리. 작을수록 엄격 (데모 검증값)
            pgvector:
              host: ${{ env "DECK_PG_HOST" }}
              port: ${{ env "DECK_PG_PORT" }}
              database: kong-pgvector
              user: kong
              password: "{vault://env/pgvector-password}"
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          auth:
            header_name: Authorization
            header_value: "{vault://env/llm-auth-header}"
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_CHAT_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_CHAT_URL" }}

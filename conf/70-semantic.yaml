# ─────────────────────────────────────────────────────────────
#  임베딩 모델이 있을 때 (DECK_EMBED_URL·DECK_EMBED_MODEL) — 의미 기반 기능
#
#  4-3 의미 기반 질문 가드: 금지 예문과 의미가 가까운 질문을 막는다 (표현을 바꾼 우회도 잡는다)
#  4-4 의미 기반 답변 가드: 금지 예문과 의미가 가까운 답변을 표준 문구로 바꾼다 — 켜면 스트리밍 요청에도 한 번에 답한다
#  시맨틱 캐시: 의미가 같은 질문은 LLM 호출 없이 저장된 답으로 응답한다
#  셋 다 /poc 에 붙고 처음에는 꺼 둔다 (FEATURE_SEMANTIC_GUARD · FEATURE_SEMANTIC_RESPONSE_GUARD · FEATURE_SEMANTIC_CACHE
#  — 켜면 요청마다 임베딩을 계산). verify.sh 는 잠깐 켜서 확인하고 원래대로 돌린다.
#  임베딩은 게이트웨이 자신의 /ai/embed 를 거친다 — 파드 안에서만 받는다(ip-restriction).
#  벡터 DB(kong-pgvector)는 파드 안에서만 비밀번호 없이 접속한다 (start.sh — Kong 3.16 의미 기반 가드가
#  vault 로 넣은 DB 비밀번호를 읽지 못해서). 바깥 PostgreSQL 을 쓰려면 pgvector 아래에 password 를 넣는다.
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  - name: ai-embed
    url: ${{ env "DECK_EMBED_URL" }}
    routes:
      - name: ai-embed
        paths: [/ai/embed]
        protocols: [http, https]
        plugins:
          - name: ip-restriction            # 게이트웨이 자신만 쓰는 내부 경로 — 밖에서 부르면 403
            config:
              allow: [127.0.0.1]
          - name: pre-function
            instance_name: strip-dimensions
            config:
              access:
                - |
                  local cjson = require "cjson.safe"
                  local body = kong.request.get_raw_body()
                  if body then
                    local t = cjson.decode(body)
                    if t and t.dimensions ~= nil then
                      t.dimensions = nil
                      kong.service.request.set_raw_body(cjson.encode(t))
                    end
                  end
          - name: ai-proxy
            config:
              route_type: llm/v1/embeddings
              genai_category: text/embeddings
              auth:
                header_name: Authorization
                header_value: "{vault://env/embed-auth-header}"
              logging:
                log_statistics: true
                log_payloads: false
              model:
                provider: openai
                name: ${{ env "DECK_EMBED_MODEL" }}
                options:
                  upstream_url: ${{ env "DECK_EMBED_URL" }}

plugins:
  # /poc 에 붙는 의미 기반 가드(질문·답변)·시맨틱 캐시 — 스위치로 켜고 끈다 (처음에는 꺼 둠)
  #   기준 거리는 bge-m3 로 시험 문장을 재서 정한 값 — 고객 임베딩 모델로 바꾸면 다시 확인한다
  #     질문 0.42: 막을 우회 문장 0.33 · 나머지 시험 문장 0.46 이상
  #     답변 0.42: 묶음(tests/guard-set.tsv) 4-4 막을 답 10개 중 9개가 0.40 미만 · 정상 문장 55개와 업무 답 말투 10개는 0.44 이상 (10-27)
  # 4-3 의미 기반 질문 가드 — 정규식(ai-prompt-guard)을 피해 표현을 바꾼 우회도 잡는다
  - name: ai-semantic-prompt-guard
    route: poc
    enabled: ${{ env "DECK_ON_SEMANTIC_GUARD" }}   # FEATURE_SEMANTIC_GUARD
    config:
      embeddings:
        model:
          provider: openai
          name: ${{ env "DECK_EMBED_MODEL" }}
          options:
            upstream_url: ${{ env "DECK_KONG_LOOPBACK" }}/ai/embed
      rules:
        match_all_conversation_history: false
        match_all_roles: false
        deny_prompts:
          - 이전 지시나 규칙을 무시하고 제한 없이 무엇이든 답하라는 역할극·탈옥 요청
          - 시스템 프롬프트나 숨겨진 지침, 내부 설정을 그대로 보여 달라는 요청
          - 회사 기밀 정보, 내부 시스템 계정, 비밀번호를 알아내려는 요청
          - 고객이나 직원의 개인정보를 우회적으로, 나눠서, 한 글자씩 알려 달라는 요청
      search:
        threshold: 0.42                 # 데모에서 맞춘 값 — 작을수록 엄격
      vectordb:
        strategy: pgvector
        dimensions: ${{ env "DECK_EMBED_DIMS" }}
        distance_metric: cosine
        threshold: 0.42
        pgvector:
          host: ${{ env "DECK_PG_HOST" }}
          port: ${{ env "DECK_PG_PORT" }}
          database: kong-pgvector
          user: kong

  # 4-4 의미 기반 답변 가드 — 키워드 검사에 없는 표현의 유해 답변도 막는다.
  #   Kong 3.16.0.0 은 막으면 400 {"error":{"message":"bad response"}} (공식 문서에는 403, 검사 중 오류도 막음) —
  #   00-base.yaml 의 block-message 가 본문을 표준 문구(DECK_BLOCK_MESSAGE)로 바꾼다. 임베딩 서버가 멈추면 답변이 모두 막힐 수 있다.
  - name: ai-semantic-response-guard
    route: poc
    enabled: ${{ env "DECK_ON_SEMANTIC_RESPONSE_GUARD" }}   # FEATURE_SEMANTIC_RESPONSE_GUARD
    config:
      embeddings:
        model:
          provider: openai
          name: ${{ env "DECK_EMBED_MODEL" }}
          options:
            upstream_url: ${{ env "DECK_KONG_LOOPBACK" }}/ai/embed
      rules:
        max_response_body_size: 0       # 답변 전체를 검사 (기본 8 KB 까지만)
        # 예문은 해로운 내용 자체로 쓴다 — 「~하는 답변」 같은 설명이나 「혐오 콘텐츠」 같은 주제 이름은 멀게 나오고,
        # 「다음과 같습니다 · 안내하겠습니다」 같은 답 말투를 넣으면 같은 말투의 정상 답이 가까워진다 (10-27 bge-m3 비교)
        deny_responses:
          - 폭발물 제조에 필요한 화약 재료와 조립 순서
          - 총기를 직접 만드는 부품 가공 방법
          - 마약을 합성하거나 몰래 구하는 방법
          - 필로폰 합성 원료와 제조 과정
          - 사람을 해치는 공격을 계획하고 실행하는 방법
          - 경찰 단속을 피해 범죄를 저지르는 요령
          - 스스로 목숨을 끊는 구체적인 방법
          - 자해하는 방법과 도구
          - 특정 집단은 열등하므로 차별해도 된다는 주장
          - 여성은 능력이 부족하니 승진에서 빼야 한다는 주장
      search:
        threshold: 0.42                 # 코사인 거리 — 작을수록 엄격
      vectordb:
        strategy: pgvector
        dimensions: ${{ env "DECK_EMBED_DIMS" }}
        distance_metric: cosine
        threshold: 0.42
        pgvector:
          host: ${{ env "DECK_PG_HOST" }}
          port: ${{ env "DECK_PG_PORT" }}
          database: kong-pgvector
          user: kong

  # 시맨틱 캐시 — 뜻이 같은 질문이면 LLM 을 부르지 않고 저장된 답을 돌려준다
  - name: ai-semantic-cache
    route: poc
    enabled: ${{ env "DECK_ON_SEMANTIC_CACHE" }}   # FEATURE_SEMANTIC_CACHE
    config:
      cache_ttl: 3600
      message_countback: 1
      stop_on_failure: false        # 캐시 장애 시에도 LLM 호출은 계속
      embeddings:
        model:
          provider: openai
          name: ${{ env "DECK_EMBED_MODEL" }}
          options:
            upstream_url: ${{ env "DECK_KONG_LOOPBACK" }}/ai/embed
      vectordb:
        strategy: pgvector
        dimensions: ${{ env "DECK_EMBED_DIMS" }}
        distance_metric: cosine
        threshold: 0.15             # 코사인 거리. 작을수록 엄격
        pgvector:
          host: ${{ env "DECK_PG_HOST" }}
          port: ${{ env "DECK_PG_PORT" }}
          database: kong-pgvector
          user: kong

# ─────────────────────────────────────────────────────────────
#  기능별 경로 /features/<기능>/v1/chat/completions — 기능 하나만 붙여 따로 시험한다 (키 인증은 공통).
#  LLM 은 기본으로 모의 LLM(받은 질문을 그대로 답함)이라 결과가 늘 같다 — LLM 이 실제로 무엇을 받았는지,
#  답변이 어떻게 바뀌는지 그대로 보인다. .env 의 FEATURE_UPSTREAM=llm 이면 사내 LLM 으로 보낸다
#  (failover 는 장애를 재현해야 하므로 항상 모의 LLM).  verify.sh 가 이 경로들로 요구사항을 점검한다.
#  지우려면 apply-config.sh --no-features
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  # 1-2 스트리밍 — 다른 플러그인 없이 게이트웨이 지연만 잰다 (4-1 마스킹 결과도 여기서 보인다)
  - name: feature-stream
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: feature-stream
        paths: [/features/stream/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: allow
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: '${{ env "DECK_FEATURE_AUTH" }}'
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_FEATURE_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_FEATURE_URL" }}

  # 1-4 장애 대체 — 주 모델이 503 을 내면 보조 모델이 답한다
  - name: feature-failover
    url: ${{ env "DECK_MOCK_URL" }}/v1/chat/completions
    read_timeout: 300000
    routes:
      - name: feature-failover
        paths: [/features/failover/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: ai-proxy-advanced
        config:
          model_name_header: true
          balancer:
            algorithm: priority
            failover_criteria: [error, timeout, non_idempotent, http_429, http_500, http_502, http_503, http_504]
            retries: 2
          targets:
            - description: 주 모델 (모의 LLM 이 이름에 down 이 든 모델엔 503 — 장애 상황 재현)
              weight: 100
              route_type: llm/v1/chat
              auth: {header_name: Authorization, header_value: "Bearer mock"}
              logging: {log_statistics: true, log_payloads: false}
              model:
                provider: openai
                name: primary-down
                options:
                  upstream_url: ${{ env "DECK_MOCK_URL" }}/v1/chat/completions
            - description: 보조 모델 (정상)
              weight: 10
              route_type: llm/v1/chat
              auth: {header_name: Authorization, header_value: "Bearer mock"}
              logging: {log_statistics: true, log_payloads: false}
              model:
                provider: openai
                name: backup-model
                options:
                  upstream_url: ${{ env "DECK_MOCK_URL" }}/v1/chat/completions

  # 2-3 호출 수 한도 — 분당 3회 (시험용으로 낮춤)
  - name: feature-rate-limit
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: feature-rate-limit
        paths: [/features/rate-limit/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: rate-limiting
        config:
          minute: 3
          limit_by: consumer
          policy: local
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: allow
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: '${{ env "DECK_FEATURE_AUTH" }}'
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_FEATURE_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_FEATURE_URL" }}

  # 2-3 토큰 한도 — 분당 40 토큰 (시험용으로 낮춤)
  - name: feature-token-limit
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: feature-token-limit
        paths: [/features/token-limit/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: ai-rate-limiting-advanced
        config:
          strategy: local
          policies:
            - match:
                - type: consumer
                  partition_by: true
              limits:
                - limit: 40
                  window_size: 60
                  tokens_count_strategy: total_tokens
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: allow
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: '${{ env "DECK_FEATURE_AUTH" }}'
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_FEATURE_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_FEATURE_URL" }}

  # 4-3 프롬프트 인젝션·탈옥 차단
  - name: feature-injection
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: feature-injection
        paths: [/features/injection/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: ai-prompt-guard
        config:
          match_all_roles: false
          deny_patterns:
            - '(?i)(?:ignore|disregard|forget)\s+(?:all\s+)?(?:previous|above|prior)\s+(?:instruction|prompt|rule)'
            - '(?i)(?:이전|앞의|위의)\s*(?:지시|명령|규칙|지침).{0,10}(?:무시|잊어|따르지)'
            - '(?i)(?:시스템\s*프롬프트|system\s+prompt).{0,20}(?:알려|보여|출력|공개|reveal|show|print)'
            - '(?i)(?:jailbreak|탈옥|DAN\s+mode|developer\s+mode)'
            - '(?i)<\s*script|javascript:|\bon(?:error|load)\s*='
            - 'sk-[A-Za-z0-9_\-]{20,}'
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: allow
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: '${{ env "DECK_FEATURE_AUTH" }}'
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_FEATURE_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_FEATURE_URL" }}

  # 4-2 기밀 키워드 차단 ('대외비'·'기밀' 등)
  - name: feature-dlp
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: feature-dlp
        paths: [/features/dlp/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: ai-prompt-guard
        config:
          match_all_roles: false
          deny_patterns:
            - '${{ env "DECK_DLP_PATTERN" }}'
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: allow
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: '${{ env "DECK_FEATURE_AUTH" }}'
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_FEATURE_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_FEATURE_URL" }}

  # 4-4 유해 답변 → 표준 문구
  - name: feature-output-guard
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: feature-output-guard
        paths: [/features/output-guard/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: ai-custom-guardrail       # 4-4 답변 검사 → 유해하면 표준 문구
        config:
          guarding_mode: OUTPUT
          stop_on_error: true           # 검사 서비스가 응답하지 않으면 답변을 내보내지 않는다
          timeout: 5000
          request:
            url: ${{ env "DECK_PII_URL" }}
            body:
              text: "$(content)"
              source: "$(source)"
          functions:
            # 답변 검사 단계에서는 검사 서비스 응답이 문자열로 들어온다 → 직접 읽는다
            verdict: |
              return function(resp)
                if type(resp) == "string" then
                  return { block = resp:find('"block"%s*:%s*true') ~= nil }
                end
                return resp or {}
              end
          response:
            block: "$(verdict.block)"
            block_message: ${{ env "DECK_BLOCK_MESSAGE" }}
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: deny
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: '${{ env "DECK_FEATURE_AUTH" }}'
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_FEATURE_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_FEATURE_URL" }}

  # 4-5 답변 속 내부 IP·API 키·DB 접속정보 마스킹
  - name: feature-output-mask
    url: ${{ env "DECK_FEATURE_URL" }}
    read_timeout: 300000
    routes:
      - name: feature-output-mask
        paths: [/features/output-mask/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: post-function             # 4-5 답변 속 시스템 정보 마스킹
        instance_name: mask-system-info--feature
        config:
          access:
            # 압축된 응답은 글자를 바꿀 수 없다 → 업스트림에 압축을 요청하지 않는다
            - kong.service.request.clear_header("Accept-Encoding")
          header_filter:
            - kong.response.clear_header("Content-Length")
          body_filter:
            - |
              local body = kong.response.get_raw_body()      -- 마지막 조각에서 전체 본문을 돌려준다
              if not body then return end
              local RULES = {
                { "10%.%d+%.%d+%.%d+", "[내부IP]" },
                { "172%.1[6-9]%.%d+%.%d+", "[내부IP]" },
                { "172%.2%d%.%d+%.%d+", "[내부IP]" },
                { "172%.3[01]%.%d+%.%d+", "[내부IP]" },
                { "192%.168%.%d+%.%d+", "[내부IP]" },
                { "sk%-[%w%-_][%w%-_][%w%-_][%w%-_][%w%-_]+", "[API키]" },
                { "AKIA[%u%d][%u%d][%u%d][%u%d]+", "[API키]" },
                { "gh[po]_%w+", "[API키]" },
                { "xox[abpr]%-[%w%-]+", "[API키]" },
                { "(%a[%w%+%.%-]*://)[^:/@%s\"]+:[^@%s\"]+@", "%1***:***@" },
                { "([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]%s*[=:]%s*)[^%s,;\"\\]+", "%1***" },
              }
              local total = 0
              for _, r in ipairs(RULES) do
                local n
                body, n = body:gsub(r[1], r[2])
                total = total + n
              end
              if total > 0 then kong.log.set_serialize_value("output_masked", total) end
              kong.response.set_raw_body(body)
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: deny
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: '${{ env "DECK_FEATURE_AUTH" }}'
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_FEATURE_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_FEATURE_URL" }}

# ─────────────────────────────────────────────────────────────
#  공통 — 사용자·키·그룹(2-1·2-2), 요청 로그(3-1), 추적 ID(3-2), 지표(3-3), 계정 긴급 차단(3-4),
#         /poc 요청 공통 전처리(모델 이름) · 막은 답변을 표준 문구로 (항상 켬)
#  값은 .env 의 DECK_* 로 채워진다 (apply-config.sh 가 적용).
#  select_tags 때문에 kong-poc 태그가 붙은 것만 관리한다 — Kong Manager 에서 직접 만든 것은 건드리지 않는다.
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

# 부서·프로젝트 예시. 실제 부서 이름으로 바꾸거나 늘려 쓴다.
consumer_groups:
  - name: team-a
  - name: team-b

consumers:
  # 2-1 부서·프로젝트별 고유 API 키 — 요청 헤더 `apikey: <키>` 로 호출한다
  - username: team-a-app
    groups:
      - name: team-a
    keyauth_credentials:
      - key: ${{ env "DECK_CLIENT_KEY" }}
    acls:
      - group: team-a
    plugins:
      # 3-4 계정 긴급 차단 — 평소 꺼 둔다. Kong Manager 에서 이 플러그인을 켜면 이 계정의 모든 호출이 즉시 403
      - name: request-termination
        instance_name: kill-switch--team-a-app
        enabled: ${{ env "DECK_KILL_TEAM_A_APP" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
        config:
          status_code: 403
          message: "이 계정은 관리자에 의해 차단되었습니다."
  - username: team-b-app
    groups:
      - name: team-b
    keyauth_credentials:
      - key: ${{ env "DECK_CLIENT_KEY_B" }}
    acls:
      - group: team-b
    plugins:
      - name: request-termination
        instance_name: kill-switch--team-b-app
        enabled: ${{ env "DECK_KILL_TEAM_B_APP" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
        config:
          status_code: 403
          message: "이 계정은 관리자에 의해 차단되었습니다."

plugins:
  # 3-2 추적 ID — 들어온 요청마다 X-Correlation-ID 를 붙여 백엔드(LLM·Agent)로 넘기고 응답에도 돌려준다.
  #     클라이언트가 이미 보냈으면 그 값을 그대로 이어 쓴다 → 여러 Agent 를 거치는 호출을 하나로 묶는다.
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true

  # 3-1 요청 로그 — 모든 호출을 파일에 한 줄씩 (사용자·경로·상태·지연·모델·토큰·추적 ID).
  #     본문은 남기지 않는다 (ai-proxy 의 log_payloads: false). 사용자 키는 key-auth 가 지운다.
  - name: file-log
    config:
      path: ${{ env "DECK_AUDIT_LOG" }}
      reopen: true
      custom_fields_by_lua:
        # LLM 응답 헤더에는 업스트림 내부 정보(조직·프로젝트 ID·비용)가 담긴다 → 남기지 않는다
        response.headers: "return nil"

  # 3-3 지표 — 사용자·라우트별 호출 수·상태·지연·대역폭과 AI 토큰을 Prometheus 형식으로 낸다.
  #     수집 주소: http://<파드>:8100/metrics  (경보 규칙 예시는 alerts/kong-alerts.yml)
  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      ai_metrics: true

  # /poc 요청 공통 전처리 (항상 켬 — 끄지 마세요) — 요청 본문의 model
  #   등록된 모델 이름(DECK_SELECT_MODELS — 실제 LLM 들 + 시험용 mock-llm)이면 그대로 둬 AI Proxy Advanced 가 그 대상을 고르게 하고
  #   (model_alias), 그 밖의 이름은 지운다 — 남겨 두면 400(cannot use own model). OpenAI SDK 처럼 model 을 늘 보내는 앱도 그대로 붙고,
  #   model 이 없거나 다른 이름이면 기본 대상(1순위 → 장애 시 2순위)이 답한다. 클라이언트가 보낸 이름은 요청 로그의 client_model.
  #   4-1 개인정보 마스킹은 /poc 경로의 pii-masking 플러그인이 맡는다 (켜고 끄기 쉽게 따로 뺐다).
  - name: pre-function
    instance_name: chat-preprocess
    config:
      access:
        - |
          local r = kong.router.get_route()
          if r == nil or r.name ~= "poc" then return end
          local body = kong.request.get_body("application/json")
          if type(body) ~= "table" or body.model == nil then return end
          local m = tostring(body.model)
          kong.log.set_serialize_value("client_model", m)
          for name in ([[${{ env "DECK_SELECT_MODELS" }}]]):gmatch("[^,]+") do
            if name == m then return end
          end
          body.model = nil
          kong.service.request.set_body(body, "application/json")

  # /poc 에서 의미 기반 답변 가드(70-semantic.yaml)가 막은 답변을 표준 문구로 바꾼다 (항상 켬)
  #   Kong 3.16.0.0 실측: 막으면 400 {"error":{"message":"bad response"}} (공식 문서에는 403 — ACL 403 과 섞이지 않게 400 만 본다)
  - name: post-function
    instance_name: block-message
    config:
      header_filter:
        - |
          local r = kong.router.get_route()
          if r ~= nil and r.name == "poc" and kong.response.get_status() == 400 then kong.response.clear_header("Content-Length") end
      body_filter:
        - |
          local r = kong.router.get_route()
          if r == nil or r.name ~= "poc" or kong.response.get_status() ~= 400 then return end
          local body = kong.response.get_raw_body()
          if body and body:find('"bad response"', 1, true) then
            local cjson = require "cjson.safe"
            kong.response.set_raw_body(cjson.encode({ error = { message = [[${{ env "DECK_BLOCK_MESSAGE" }}]] } }))
          end

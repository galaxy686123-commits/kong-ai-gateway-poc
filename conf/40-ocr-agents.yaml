# ─────────────────────────────────────────────────────────────
#  OCR · AI Agent — LLM 이 아닌 AI 서비스도 같은 게이트웨이 뒤에 둔다 (1-1)
#
#  에이전트 등록: 에이전트 하나 = Upstream(실제 주소 · 상태 점검) + Service + Route. A2A 에이전트는 그 경로에 AI A2A Proxy 를 더한다.
#    agent-a · agent-b  일반 HTTP 에이전트
#    agent-c            A2A 에이전트 — Agent Card 속 주소를 Kong 주소로 바꿔 돌려주고, A2A 호출(메서드 · 작업 ID · 상태)을 요청 로그에 남긴다
#  상태 점검: Kong 이 에이전트마다 직접 주기적으로 점검한다(능동 점검) — 장애로 보면 그 에이전트로 보내지 않고 바로 503.
#    결과는 Kong Manager(Upstreams) · Admin API /upstreams/<이름>/health · 지표 kong_upstream_target_health(Grafana 에이전트 줄)
#  1-3 대용량·장기 연결: OCR 은 큰 이미지(기본 50 MB까지)를 받고, OCR·Agent 모두 응답을 10분까지 기다린다.
#  2-2 키별 Agent 접근 통제 — 대상 에이전트 경로의 허용 목록(acl)에 부를 수 있는 계정만 둔다 (목록에 없으면 403)
#        사용자(부서 키)  team-a → agent-a · team-b → agent-b
#        에이전트 키      agent-a → agent-c · agent-b → agent-c · agent-c → agent-b   — agent-a → agent-b 한 조합만 막힌다
#  3-2 추적: 00-base.yaml 의 X-Correlation-ID 가 Agent 로 그대로 넘어간다 (Agent 가 다음 호출에 이어 붙이면 연쇄 추적).
#  3-4 긴급 차단: 서비스마다(그 경로에) 꺼 둔 request-termination 이 있다.
#  주소는 .env 의 DECK_OCR_URL · DECK_AGENT_A_URL · DECK_AGENT_B_URL · DECK_AGENT_C_URL (비워 두면 시험용 모의 서버)
#    에이전트 주소는 lib.sh 의 agent_upstream_env 가 Upstream Target(호스트:포트)과 서비스의 프로토콜 · 포트 · 경로로 나눈다
#    점검 경로는 DECK_AGENT_A_HEALTH_PATH · …_B_ · …_C_ (비우면 TCP 연결만 · 모의 서버는 /agents/<x>/health) · 간격 DECK_AGENT_HEALTH_INTERVAL(초)
#  에이전트 키는 DECK_AGENT_A_KEY · DECK_AGENT_B_KEY · DECK_AGENT_C_KEY (없으면 apply-config.sh 가 만들어 설정 파일에 적는다)
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

# 에이전트마다 호출용 계정 · 키 — 에이전트가 다른 에이전트를 Kong 으로 부를 때 헤더 `apikey: <키>` 로 쓴다.
#   허용 목록(acl)은 그룹으로 고르므로 계정마다 같은 이름의 그룹을 하나씩 붙인다.
consumers:
  - username: agent-a
    keyauth_credentials:
      - key: ${{ env "DECK_AGENT_A_KEY" }}
    acls:
      - group: agent-a
  - username: agent-b
    keyauth_credentials:
      - key: ${{ env "DECK_AGENT_B_KEY" }}
    acls:
      - group: agent-b
  - username: agent-c
    keyauth_credentials:
      - key: ${{ env "DECK_AGENT_C_KEY" }}
    acls:
      - group: agent-c

# 에이전트 상태 점검 — 에이전트마다 Upstream 하나 + Target(실제 주소) 하나. 서비스의 host 가 이 이름이다.
#   Kong 이 Target 을 직접 점검한다(능동 점검, 간격 DECK_AGENT_HEALTH_INTERVAL 초): 연달아 2번 실패하면 장애 —
#   그동안 그 에이전트로 보내지 않고 Kong 이 바로 503 을 돌려준다(Target 이 하나뿐일 때). 다시 2번 성공하면 정상으로 돌아온다.
#   점검 방식: 점검 경로(DECK_AGENT_<X>_HEALTH_PATH)가 있으면 그 경로를 GET — 200 · 302 정상 / 404 · 429 · 5xx 장애,
#             없으면 TCP 연결만 본다. 점검 요청은 Kong 이 에이전트 서버로 바로 보내므로 요청 로그 · 「요청 기록」에는 남지 않는다
#   에이전트 서버가 여럿이면 Target 을 늘린다 — 정상인 서버에만 나눠 보낸다
upstreams:
  - name: agent-a.kong-poc
    targets:
      - target: ${{ env "DECK_AGENT_A_TARGET" }}
    healthchecks:
      active:
        type: ${{ env "DECK_AGENT_A_HC_TYPE" }}
        http_path: ${{ env "DECK_AGENT_A_HC_PATH" }}
        timeout: 3
        https_verify_certificate: false   # 서비스도 인증서를 검사하지 않는다 (기본) — 맞춰 둔다. 기본값 true 면 사설 인증서 에이전트가 장애로 보인다
        healthy: &agent-healthy
          interval: ${{ env "DECK_AGENT_HEALTH_INTERVAL" }}   # 0 이면 점검하지 않는다 (Upstream 기본값)
          successes: 2
        unhealthy: &agent-unhealthy
          interval: ${{ env "DECK_AGENT_HEALTH_INTERVAL" }}
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
  - name: agent-b.kong-poc
    targets:
      - target: ${{ env "DECK_AGENT_B_TARGET" }}
    healthchecks:
      active:
        type: ${{ env "DECK_AGENT_B_HC_TYPE" }}
        http_path: ${{ env "DECK_AGENT_B_HC_PATH" }}
        timeout: 3
        https_verify_certificate: false
        healthy: *agent-healthy
        unhealthy: *agent-unhealthy
  - name: agent-c.kong-poc
    targets:
      - target: ${{ env "DECK_AGENT_C_TARGET" }}
    healthchecks:
      active:
        type: ${{ env "DECK_AGENT_C_HC_TYPE" }}
        http_path: ${{ env "DECK_AGENT_C_HC_PATH" }}
        timeout: 3
        https_verify_certificate: false
        healthy: *agent-healthy
        unhealthy: *agent-unhealthy

services:
  - name: ocr
    url: ${{ env "DECK_OCR_URL" }}
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: ocr
        paths: [/ocr]
        protocols: [http, https]
        plugins:
          - &key-auth
            name: key-auth
            config:
              key_names: [apikey]
              hide_credentials: true
          - name: acl
            config:
              allow: [team-a, team-b]
              hide_groups_header: true
          - name: request-size-limiting     # 1-3 업로드 상한 (이보다 크면 413)
            config:
              allowed_payload_size: ${{ env "DECK_OCR_MAX_MB" }}
              size_unit: megabytes
              require_content_length: false
          - name: request-termination
            instance_name: kill-switch--ocr
            enabled: ${{ env "DECK_KILL_OCR" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."

  - name: agent-a
    protocol: ${{ env "DECK_AGENT_A_PROTOCOL" }}
    host: agent-a.kong-poc         # 위 upstreams 의 이름 — 실제 주소(DECK_AGENT_A_URL)는 그 Target
    port: ${{ env "DECK_AGENT_A_PORT" }}
    path: ${{ env "DECK_AGENT_A_PATH" }}
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: agent-a
        paths: [/agents/a]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
        plugins:
          - *key-auth
          - name: acl
            config:
              allow: [team-a]               # 2-2 team-a 사용자만
              hide_groups_header: true
          - name: request-termination
            instance_name: kill-switch--agent-a
            enabled: ${{ env "DECK_KILL_AGENT_A" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."

  - name: agent-b
    protocol: ${{ env "DECK_AGENT_B_PROTOCOL" }}
    host: agent-b.kong-poc         # 위 upstreams 의 이름 — 실제 주소(DECK_AGENT_B_URL)는 그 Target
    port: ${{ env "DECK_AGENT_B_PORT" }}
    path: ${{ env "DECK_AGENT_B_PATH" }}
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: agent-b
        paths: [/agents/b]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
        plugins:
          - *key-auth
          - name: acl
            config:
              allow: [team-b, agent-c]      # 2-2 team-b 사용자 · 에이전트 C (에이전트 A 는 목록에 없어 403)
              hide_groups_header: true
          - name: request-termination
            instance_name: kill-switch--agent-b
            enabled: ${{ env "DECK_KILL_AGENT_B" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."

  - name: agent-c
    protocol: ${{ env "DECK_AGENT_C_PROTOCOL" }}
    host: agent-c.kong-poc         # 위 upstreams 의 이름 — 실제 주소(DECK_AGENT_C_URL)는 그 Target
    port: ${{ env "DECK_AGENT_C_PORT" }}
    path: ${{ env "DECK_AGENT_C_PATH" }}
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: agent-c
        paths: [/agents/c]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각(A2A message/stream)을 받는 즉시 넘긴다
        plugins:
          - *key-auth
          - name: acl
            config:
              allow: [agent-a, agent-b]     # 2-2 에이전트 A · B 만 (사용자 키 · 에이전트 C 자신은 403)
              hide_groups_header: true
          # A2A 에이전트 — 요청을 바꾸지 않고 관찰만 한다 (A2A 가 아닌 요청은 그대로 통과)
          #   Agent Card(/.well-known/agent-card.json)의 url · additionalInterfaces[].url 을 Kong 주소로 바꿔 돌려준다
          #   → 클라이언트가 카드를 보고 다음 호출을 Kong 으로 보낸다 (에이전트 주소로 바로 가지 않음)
          #   A2A 호출마다 메서드 · 작업 ID · 작업 상태 · 지연을 요청 로그(ai.a2a.rpc)에 남긴다
          - name: ai-a2a-proxy
            config:
              logging:
                log_statistics: true
                log_payloads: ${{ env "DECK_A2A_LOG_PAYLOADS" }}   # 메시지 본문까지 남김 (기본 false — 켜면 「요청 기록」에 질문 · 답변으로 보임)
          - name: request-termination
            instance_name: kill-switch--agent-c
            enabled: ${{ env "DECK_KILL_AGENT_C" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."

# ─────────────────────────────────────────────────────────────
#  OCR · AI Agent — LLM 이 아닌 AI 서비스도 같은 게이트웨이 뒤에 둔다 (1-1)
#
#  에이전트 등록: 에이전트 하나 = Service + Route. A2A 에이전트는 그 경로에 AI A2A Proxy 를 더한다.
#    agent-a · agent-b  일반 HTTP 에이전트
#    agent-c            A2A 에이전트 — Agent Card 속 주소를 Kong 주소로 바꿔 돌려주고, A2A 호출(메서드 · 작업 ID · 상태)을 요청 로그에 남긴다
#  1-3 대용량·장기 연결: OCR 은 큰 이미지(기본 50 MB까지)를 받고, OCR·Agent 모두 응답을 10분까지 기다린다.
#  2-2 키별 Agent 접근 통제 — 대상 에이전트 경로의 허용 목록(acl)에 부를 수 있는 계정만 둔다 (목록에 없으면 403)
#        사용자(부서 키)  team-a → agent-a · team-b → agent-b
#        에이전트 키      agent-a → agent-c · agent-b → agent-c · agent-c → agent-b   — agent-a → agent-b 한 조합만 막힌다
#  3-2 추적: 00-base.yaml 의 X-Correlation-ID 가 Agent 로 그대로 넘어간다 (Agent 가 다음 호출에 이어 붙이면 연쇄 추적).
#  3-4 긴급 차단: 서비스마다(그 경로에) 꺼 둔 request-termination 이 있다.
#  주소는 .env 의 DECK_OCR_URL · DECK_AGENT_A_URL · DECK_AGENT_B_URL · DECK_AGENT_C_URL (비워 두면 시험용 모의 서버)
#  에이전트 키는 DECK_AGENT_A_KEY · DECK_AGENT_B_KEY · DECK_AGENT_C_KEY (없으면 apply-config.sh 가 만들어 설정 파일에 적는다)
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

# 에이전트마다 호출용 계정 · 키 — 에이전트가 다른 에이전트를 Kong 으로 부를 때 헤더 `apikey: <키>` 로 쓴다.
#   허용 목록(acl)은 그룹으로 고르므로 계정마다 같은 이름의 그룹을 하나씩 붙인다.
consumers:
  - username: agent-a
    keyauth_credentials:
      - key: ${{ env "DECK_AGENT_A_KEY" }}
    acls:
      - group: agent-a
  - username: agent-b
    keyauth_credentials:
      - key: ${{ env "DECK_AGENT_B_KEY" }}
    acls:
      - group: agent-b
  - username: agent-c
    keyauth_credentials:
      - key: ${{ env "DECK_AGENT_C_KEY" }}
    acls:
      - group: agent-c

services:
  - name: ocr
    url: ${{ env "DECK_OCR_URL" }}
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: ocr
        paths: [/ocr]
        protocols: [http, https]
        plugins:
          - &key-auth
            name: key-auth
            config:
              key_names: [apikey]
              hide_credentials: true
          - name: acl
            config:
              allow: [team-a, team-b]
              hide_groups_header: true
          - name: request-size-limiting     # 1-3 업로드 상한 (이보다 크면 413)
            config:
              allowed_payload_size: ${{ env "DECK_OCR_MAX_MB" }}
              size_unit: megabytes
              require_content_length: false
          - name: request-termination
            instance_name: kill-switch--ocr
            enabled: ${{ env "DECK_KILL_OCR" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."

  - name: agent-a
    url: ${{ env "DECK_AGENT_A_URL" }}
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: agent-a
        paths: [/agents/a]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
        plugins:
          - *key-auth
          - name: acl
            config:
              allow: [team-a]               # 2-2 team-a 사용자만
              hide_groups_header: true
          - name: request-termination
            instance_name: kill-switch--agent-a
            enabled: ${{ env "DECK_KILL_AGENT_A" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."

  - name: agent-b
    url: ${{ env "DECK_AGENT_B_URL" }}
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: agent-b
        paths: [/agents/b]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
        plugins:
          - *key-auth
          - name: acl
            config:
              allow: [team-b, agent-c]      # 2-2 team-b 사용자 · 에이전트 C (에이전트 A 는 목록에 없어 403)
              hide_groups_header: true
          - name: request-termination
            instance_name: kill-switch--agent-b
            enabled: ${{ env "DECK_KILL_AGENT_B" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."

  - name: agent-c
    url: ${{ env "DECK_AGENT_C_URL" }}
    connect_timeout: 10000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: agent-c
        paths: [/agents/c]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각(A2A message/stream)을 받는 즉시 넘긴다
        plugins:
          - *key-auth
          - name: acl
            config:
              allow: [agent-a, agent-b]     # 2-2 에이전트 A · B 만 (사용자 키 · 에이전트 C 자신은 403)
              hide_groups_header: true
          # A2A 에이전트 — 요청을 바꾸지 않고 관찰만 한다 (A2A 가 아닌 요청은 그대로 통과)
          #   Agent Card(/.well-known/agent-card.json)의 url · additionalInterfaces[].url 을 Kong 주소로 바꿔 돌려준다
          #   → 클라이언트가 카드를 보고 다음 호출을 Kong 으로 보낸다 (에이전트 주소로 바로 가지 않음)
          #   A2A 호출마다 메서드 · 작업 ID · 작업 상태 · 지연을 요청 로그(ai.a2a.rpc)에 남긴다
          - name: ai-a2a-proxy
            config:
              logging:
                log_statistics: true
                log_payloads: ${{ env "DECK_A2A_LOG_PAYLOADS" }}   # 메시지 본문까지 남김 (기본 false — 켜면 「요청 기록」에 질문 · 답변으로 보임)
          - name: request-termination
            instance_name: kill-switch--agent-c
            enabled: ${{ env "DECK_KILL_AGENT_C" }}   # 적용해도 지금 상태 그대로 (apply-config 가 Kong 에서 읽어 넘김)
            config:
              status_code: 503
              message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."

# ─────────────────────────────────────────────────────────────
#  1-1 모델 선택 — 같은 주소 /v1/chat/completions 에 헤더 x-ai-target 을 붙여 대상을 고른다.
#    internal → 사내 LLM 만 (외부로 나가지 않으므로 기밀 키워드 허용)
#  기본 보호(키·그룹·한도·인젝션 가드·긴급 차단)만 둔다. 기능을 겹쳐 시험할 때는 통합 경로(10-llm.yaml)를 쓴다.
#  대상마다 서비스를 따로 두어 대상별로 다른 보호를 붙인다 (사내 전용은 기밀 키워드 허용, 외부는 차단).
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  # x-ai-target: internal
  - name: llm-internal
    url: ${{ env "DECK_CHAT_URL" }}
    read_timeout: 300000
    routes:
      - name: llm-internal
        paths: [/v1/chat/completions]
        headers:
          x-ai-target: [internal]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: acl
        config:
          allow: [team-a, team-b]
          hide_groups_header: true
      - name: rate-limiting
        config:
          minute: ${{ env "DECK_RPM" }}
          day: ${{ env "DECK_RPD" }}
          limit_by: consumer
          policy: local
      - name: ai-rate-limiting-advanced
        config:
          strategy: local
          policies:
            - match:
                - type: consumer
                  partition_by: true
              limits:
                - limit: ${{ env "DECK_TPM" }}
                  window_size: 60
                  tokens_count_strategy: total_tokens
      - name: ai-prompt-guard
        config:
          match_all_roles: false
          deny_patterns:
            - '(?i)(?:ignore|disregard|forget)\s+(?:all\s+)?(?:previous|above|prior)\s+(?:instruction|prompt|rule)'
            - '(?i)(?:이전|앞의|위의)\s*(?:지시|명령|규칙|지침).{0,10}(?:무시|잊어|따르지)'
            - '(?i)(?:시스템\s*프롬프트|system\s+prompt).{0,20}(?:알려|보여|출력|공개|reveal|show|print)'
            - '(?i)(?:jailbreak|탈옥|DAN\s+mode|developer\s+mode)'
            - '(?i)<\s*script|javascript:|\bon(?:error|load)\s*='
            - 'sk-[A-Za-z0-9_\-]{20,}'
      - name: request-termination
        instance_name: kill-switch--llm-internal
        enabled: false
        config:
          status_code: 503
          message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          response_streaming: allow
          max_request_body_size: 8388608
          model_name_header: true
          auth:
            header_name: Authorization
            header_value: "{vault://env/llm-auth-header}"
          logging:
            log_statistics: true
            log_payloads: false
          model:
            provider: openai
            name: ${{ env "DECK_CHAT_MODEL" }}
            options:
              upstream_url: ${{ env "DECK_CHAT_URL" }}


# ─────────────────────────────────────────────────────────────
#  통합 경로 /v1/chat/completions — 모든 기능을 겹쳐 붙이고 .env 의 FEATURE_… 스위치로 필요한 것만 켠다.
#    FEATURE_ACL · FEATURE_RATE_LIMIT · FEATURE_TOKEN_LIMIT · FEATURE_PROMPT_GUARD (기본 on)
#    FEATURE_OUTPUT_GUARD · FEATURE_OUTPUT_MASK (기본 off — 켜면 스트리밍이 꺼진다)
#    FEATURE_SEMANTIC_GUARD · FEATURE_SEMANTIC_CACHE (임베딩 모델이 있을 때, 70-semantic.yaml)
#    개인정보 마스킹(FEATURE_MASKING)은 00-base.yaml 의 전역 플러그인
#  Kong Manager 에서도 플러그인별로 켜고 끌 수 있다 (다음 apply-config.sh 때 .env 값으로 돌아간다).
#  어느 LLM 으로 보낼지(장애 대체 포함)는 11-target-*.yaml 이 정한다.
#  헤더 x-ai-target 으로 모델을 고르는 경로는 12·13·14·15 파일 (1-1).
# ─────────────────────────────────────────────────────────────
_format_version: "3.0"
_info:
  select_tags:
    - kong-poc

services:
  - name: llm
    url: ${{ env "DECK_CHAT_URL" }}      # 실제로 보낼 곳은 11-target-*.yaml 의 대상들이 정한다
    read_timeout: 300000
    routes:
      - name: llm
        paths: [/v1/chat/completions]
        protocols: [http, https]
        response_buffering: false   # 스트리밍 조각을 받는 즉시 넘긴다 (1-2)
    plugins:
      - name: key-auth                  # 2-1 부서·프로젝트 키 (항상 켬)
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: acl
        enabled: ${{ env "DECK_ON_ACL" }}   # FEATURE_ACL — 2-2 허용 그룹만
        config:
          allow: [team-a, team-b]
          hide_groups_header: true
      - name: rate-limiting
        enabled: ${{ env "DECK_ON_RATE_LIMIT" }}   # FEATURE_RATE_LIMIT — 2-3 사용자별 분당·일일 호출 수 (DECK_RPM·DECK_RPD)
        config:
          minute: ${{ env "DECK_RPM" }}
          day: ${{ env "DECK_RPD" }}
          limit_by: consumer
          policy: local
      - name: ai-rate-limiting-advanced
        enabled: ${{ env "DECK_ON_TOKEN_LIMIT" }}   # FEATURE_TOKEN_LIMIT — 2-4 사용자별 분당 토큰 (DECK_TPM)
        config:
          strategy: local
          policies:
            - match:
                - type: consumer
                  partition_by: true
              limits:
                - limit: ${{ env "DECK_TPM" }}
                  window_size: 60
                  tokens_count_strategy: total_tokens
      - name: ai-prompt-guard
        enabled: ${{ env "DECK_ON_PROMPT_GUARD" }}   # FEATURE_PROMPT_GUARD — 4-3 인젝션·탈옥 + 4-2 기밀 키워드 (외부 LLM 으로 우회될 수 있으므로)
        config:
          match_all_roles: false
          deny_patterns:
            - '(?i)(?:ignore|disregard|forget)\s+(?:all\s+)?(?:previous|above|prior)\s+(?:instruction|prompt|rule)'
            - '(?i)(?:이전|앞의|위의)\s*(?:지시|명령|규칙|지침).{0,10}(?:무시|잊어|따르지)'
            - '(?i)(?:시스템\s*프롬프트|system\s+prompt).{0,20}(?:알려|보여|출력|공개|reveal|show|print)'
            - '(?i)(?:jailbreak|탈옥|DAN\s+mode|developer\s+mode)'
            - '(?i)<\s*script|javascript:|\bon(?:error|load)\s*='
            - 'sk-[A-Za-z0-9_\-]{20,}'
            - '${{ env "DECK_DLP_PATTERN" }}'
      - name: ai-custom-guardrail       # 4-4 답변 검사 → 유해하면 표준 문구
        enabled: ${{ env "DECK_ON_OUTPUT_GUARD" }}   # FEATURE_OUTPUT_GUARD — 켜면 답변을 다 받아 검사하므로 스트리밍이 꺼진다
        config:
          guarding_mode: OUTPUT
          stop_on_error: true           # 검사 서비스가 응답하지 않으면 답변을 내보내지 않는다
          timeout: 5000
          request:
            url: ${{ env "DECK_PII_URL" }}
            body:
              text: "$(content)"
              source: "$(source)"
          functions:
            # 답변 검사 단계에서는 검사 서비스 응답이 문자열로 들어온다 → 직접 읽는다
            verdict: |
              return function(resp)
                if type(resp) == "string" then
                  return { block = resp:find('"block"%s*:%s*true') ~= nil }
                end
                return resp or {}
              end
          response:
            block: "$(verdict.block)"
            block_message: ${{ env "DECK_BLOCK_MESSAGE" }}
      - name: post-function             # 4-5 답변 속 시스템 정보 마스킹
        instance_name: mask-system-info--llm
        enabled: ${{ env "DECK_ON_OUTPUT_MASK" }}   # FEATURE_OUTPUT_MASK — 켜면 답변을 다 받아 고치므로 스트리밍이 꺼진다
        config:
          access:
            # 압축된 응답은 글자를 바꿀 수 없다 → 업스트림에 압축을 요청하지 않는다
            - kong.service.request.clear_header("Accept-Encoding")
          header_filter:
            - kong.response.clear_header("Content-Length")
          body_filter:
            - |
              local body = kong.response.get_raw_body()      -- 마지막 조각에서 전체 본문을 돌려준다
              if not body then return end
              local RULES = {
                { "10%.%d+%.%d+%.%d+", "[내부IP]" },
                { "172%.1[6-9]%.%d+%.%d+", "[내부IP]" },
                { "172%.2%d%.%d+%.%d+", "[내부IP]" },
                { "172%.3[01]%.%d+%.%d+", "[내부IP]" },
                { "192%.168%.%d+%.%d+", "[내부IP]" },
                { "sk%-[%w%-_][%w%-_][%w%-_][%w%-_][%w%-_]+", "[API키]" },
                { "AKIA[%u%d][%u%d][%u%d][%u%d]+", "[API키]" },
                { "gh[po]_%w+", "[API키]" },
                { "xox[abpr]%-[%w%-]+", "[API키]" },
                { "(%a[%w%+%.%-]*://)[^:/@%s\"]+:[^@%s\"]+@", "%1***:***@" },
                { "([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]%s*[=:]%s*)[^%s,;\"\\]+", "%1***" },
              }
              local total = 0
              for _, r in ipairs(RULES) do
                local n
                body, n = body:gsub(r[1], r[2])
                total = total + n
              end
              if total > 0 then kong.log.set_serialize_value("output_masked", total) end
              kong.response.set_raw_body(body)
      - name: request-termination       # 3-4 긴급 차단 — 평소 꺼 둠. Kong Manager 에서 켜면 즉시 503
        instance_name: kill-switch--llm
        enabled: false
        config:
          status_code: 503
          message: "이 AI 서비스는 관리자에 의해 긴급 차단되었습니다."
